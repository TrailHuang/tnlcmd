name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: go build ./...

      - name: Vet（含集成测试代码）
        run: go vet -tags integration ./...

      - name: Test（全量，含集成测试）
        run: go test -race -count=1 -tags integration ./...
